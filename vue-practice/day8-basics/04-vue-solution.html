<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vue解决方案：数据和HTML分离</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .shop { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Vue做法：数据和HTML分离</h2>

        <!--
            看这里！只写一次模板，v-for自动循环
            不管有多少数据，都是这一个模板
        -->
        <div v-for="shop in shops" :key="shop.id" class="shop">
            <h3>{{ shop.name }}</h3>
            <p>地址：{{ shop.address }}</p>
            <p>评分：{{ shop.score }}</p>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // 数据在这里，和HTML完全分开
                    shops: [
                        { id: 1, name: "海底捞", address: "天河区", score: 4.8 },
                        { id: 2, name: "麦当劳", address: "越秀区", score: 4.5 },
                        { id: 3, name: "肯德基", address: "番禺区", score: 4.3 }
                    ]
                }
            }
        }).mount('#app');

        // 解决了什么问题？
        // 1. 数据和HTML分离：数据在data()里，HTML在<template>里
        // 2. 不重复：用v-for循环，写一次模板，自动处理所有数据
        // 3. 如果有100个商铺，代码量不变，v-for自动循环100次
    </script>
</body>
</html>
