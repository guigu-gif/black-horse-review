<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>问题演示：数据和HTML混用</title>
    <style>
        .shop { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <h2>传统做法的问题：数据和HTML混在一起</h2>
    <div id="shop-list"></div>

    <script>
        // 模拟从后端拿到的数据（就像你返回的JSON）
        let shops = [
            { id: 1, name: "海底捞", address: "天河区", score: 4.8 },
            { id: 2, name: "麦当劳", address: "越秀区", score: 4.5 },
            { id: 3, name: "肯德基", address: "番禺区", score: 4.3 }
        ];

        // 问题来了：要把数据显示到页面上
        // 你得手动拼HTML字符串
        let html = '';

        // 看这里！数据（shops[0].name）和HTML标签混在一起
        html += '<div class="shop">';
        html += '  <h3>' + shops[0].name + '</h3>';  // ← 数据和HTML混用
        html += '  <p>地址：' + shops[0].address + '</p>';
        html += '  <p>评分：' + shops[0].score + '</p>';
        html += '</div>';

        html += '<div class="shop">';
        html += '  <h3>' + shops[1].name + '</h3>';  // ← 重复的结构
        html += '  <p>地址：' + shops[1].address + '</p>';
        html += '  <p>评分：' + shops[1].score + '</p>';
        html += '</div>';

        html += '<div class="shop">';
        html += '  <h3>' + shops[2].name + '</h3>';  // ← 又重复一遍
        html += '  <p>地址：' + shops[2].address + '</p>';
        html += '  <p>评分：' + shops[2].score + '</p>';
        html += '</div>';

        // 塞进页面
        document.getElementById('shop-list').innerHTML = html;

        // 问题总结：
        // 1. 数据和HTML混在字符串里，难看、难维护
        // 2. 如果有100个商铺，要写100遍这个结构
        // 3. 如果要改样式（比如加个收藏按钮），要改100个地方
    </script>
</body>
</html>
