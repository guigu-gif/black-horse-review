<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vue做法 - 数据驱动视图</title>
    <!-- 引入Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h2>Vue做法：数据驱动视图</h2>

        <!-- 输入框，v-model双向绑定 -->
        <input type="text" v-model="message" placeholder="输入点什么...">

        <!-- 显示区域，直接用数据 -->
        <p>你输入的内容：{{ message }}</p>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    message: ''  // 数据存在这里
                }
            }
            // 不需要写任何DOM操作代码
            // message变了，页面自动更新
        }).mount('#app');
    </script>
</body>
</html>
